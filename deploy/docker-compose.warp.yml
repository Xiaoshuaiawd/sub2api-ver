services:
  warp-proxy:
    image: caomingjun/warp:2026.6.880.0-2.12.0@sha256:98d048b8996ca2e621d29887169c5c48a4f6878e2a2c647b7ea82d69540420da
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - NET_ADMIN
    environment:
      WARP_SLEEP: "2"
      WARP_LICENSE_KEY: "${WARP_LICENSE_KEY:-}"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --socks5-hostname 127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  warp-data:
